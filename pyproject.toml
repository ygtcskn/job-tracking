[project]
name = "job-tracking"
version = "0.1.0"
description = "Hourly job-posting tracker (LinkedIn, Arbeitsagentur, Google Jobs) that writes a styled Excel sheet"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
job-tracking = "job_tracking:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
